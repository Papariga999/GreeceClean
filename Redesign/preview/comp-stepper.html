<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 26px 28px; display: flex; flex-direction: column; gap: 24px; }
  .dots { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .dot { width: 32px; height: 32px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .done { background: var(--action); color: #fff; }
  .cur { background: var(--primary); color: #fff; }
  .todo { background: var(--gray-200); color: var(--gray-400); }
  .seg { width: 32px; height: 2px; }
  .seg.f { background: var(--action); }
  .seg.e { background: var(--gray-200); }
  .label { font-size: 12px; color: var(--fg3); text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="dots">
        <span class="dot done">✓</span><span class="seg f"></span>
        <span class="dot done">✓</span><span class="seg f"></span>
        <span class="dot cur">3</span><span class="seg e"></span>
        <span class="dot todo">4</span>
      </div>
      <p class="label" style="margin-top:12px">Report-flow step dots — done · current · upcoming</p>
    </div>
  </div>
</body>
</html>
