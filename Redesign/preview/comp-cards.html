<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--gray-50); }
  .wrap { padding: 24px 28px; display: flex; gap: 16px; align-items: stretch; }
  .card { flex: 1; }
  .stat { text-align: center; }
  .statn { font-size: 30px; font-weight: 800; color: var(--primary); }
  .statl { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
  .ct { font-weight: 700; color: var(--primary); font-size: 15px; margin: 0 0 2px; }
  .cs { font-size: 11px; color: var(--gray-400); margin: 0 0 14px; }
  .muni { font-size: 13px; font-weight: 500; color: var(--gray-800); margin-bottom: 6px; }
  .track { height: 6px; background: var(--gray-100); border-radius: 9999px; overflow: hidden; }
  .fill { height: 100%; background: var(--action); border-radius: 9999px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card stat">
      <div class="statn">1,284</div>
      <div class="statl">Reports</div>
    </div>
    <div class="card">
      <p class="ct">🏆 Champions</p>
      <p class="cs">Highest resolved rate</p>
      <div class="muni">Δήμος Μήλου</div>
      <div class="track"><div class="fill" style="width:92%"></div></div>
    </div>
  </div>
</body>
</html>
