<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  .label { font-size: 13px; font-weight: 600; color: var(--fg1); }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--gray-700); }
  .circ { width: 36px; height: 36px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
  .row { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
  .circ-sm { width: 28px; height: 28px; font-size: 15px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Category Badge — emoji in a tinted circle</div>
    <div class="row">
      <span class="badge"><span class="circ" style="background:#FEE2E2">🗑️</span>Illegal Landfill</span>
      <span class="badge"><span class="circ" style="background:#CFFAFE">🌊</span>Coastal Pollution</span>
      <span class="badge"><span class="circ" style="background:#FFE4E6">☣️</span>Sewage</span>
    </div>
    <div class="row">
      <span class="badge"><span class="circ circ-sm" style="background:#DBEAFE">🚮</span>Litter</span>
      <span class="badge"><span class="circ circ-sm" style="background:#F3E8FF">🚗</span>Vehicle</span>
      <span class="badge"><span class="circ circ-sm" style="background:#FFEDD5">🌿</span>Green Waste</span>
      <span class="badge"><span class="circ circ-sm" style="background:#F3F4F6">📍</span>(fallback)</span>
    </div>
  </div>
</body>
</html>
