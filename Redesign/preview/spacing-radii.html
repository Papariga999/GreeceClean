<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 24px 28px; }
  .label { font-size: 13px; font-weight: 600; color: var(--fg1); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--fg3); margin-bottom: 18px; }
  .row { display: flex; gap: 22px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 64px; background: var(--primary-50); border: 1.5px solid var(--primary-300); }
  .nm { font-size: 11px; font-family: var(--font-mono); color: var(--fg2); }
  .px { font-size: 10px; color: var(--fg3); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Corner Radii</div>
    <div class="sub">2xl (1.5rem) is the signature — cards, buttons, inputs, photo &amp; map frames.</div>
    <div class="row">
      <div class="item"><div class="box" style="border-radius:1rem"></div><span class="nm">DEFAULT / lg</span><span class="px">1rem · 16px</span></div>
      <div class="item"><div class="box" style="border-radius:1.25rem"></div><span class="nm">xl</span><span class="px">1.25rem · 20px</span></div>
      <div class="item"><div class="box" style="border-radius:1.5rem"></div><span class="nm">2xl ★</span><span class="px">1.5rem · 24px</span></div>
      <div class="item"><div class="box" style="border-radius:9999px;width:64px"></div><span class="nm">full</span><span class="px">pills · circles</span></div>
    </div>
  </div>
</body>
</html>
