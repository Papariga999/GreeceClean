<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--fg1); }
  .wrap { padding: 26px 30px; display: flex; flex-direction: column; gap: 13px; }
  .spec { display: flex; align-items: baseline; gap: 16px; }
  .meta { width: 92px; font-size: 11px; font-family: var(--font-mono); color: var(--fg3); flex-shrink: 0; }
  .eyebrow { font-size: 14px; font-weight: 500; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.1em; }
  .body { font-size: 16px; color: var(--gray-600); line-height: 1.6; }
  .small { font-size: 14px; color: var(--gray-600); }
  .cap { font-size: 12px; color: var(--gray-400); }
  .mono { font-size: 13px; font-family: var(--font-mono); color: var(--primary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spec"><span class="meta">14 · upper</span><span class="eyebrow">What can be reported</span></div>
    <div class="spec"><span class="meta">16 · 400</span><span class="body">Photograph illegal dumps and litter. We report them to your municipality.</span></div>
    <div class="spec"><span class="meta">14 · 400</span><span class="small">3 steps · less than 1 minute</span></div>
    <div class="spec"><span class="meta">12 · 400</span><span class="cap">Submitted 14 Aug 2023 · Δήμος Θεσσαλονίκης</span></div>
    <div class="spec"><span class="meta">mono</span><span class="mono">katharos.gr/r/ab12cd34ef56</span></div>
  </div>
</body>
</html>
