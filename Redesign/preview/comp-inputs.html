<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 500; color: var(--gray-700); margin-bottom: 6px; }
  .field label .opt { color: var(--gray-400); font-weight: 400; }
  .count { text-align: right; font-size: 12px; color: var(--gray-400); margin-top: 4px; }
  textarea.gc-input { resize: none; }
  .focused { border-color: transparent !important; box-shadow: 0 0 0 2px var(--primary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="field">
      <label>Search for a location…</label>
      <input class="gc-input" type="text" placeholder="Search for a location…">
    </div>
    <div class="field">
      <label>Description <span class="opt">(optional)</span></label>
      <textarea class="gc-input focused" rows="2" placeholder="Describe the problem in a few words…">Construction debris dumped beside the coastal road.</textarea>
      <div class="count">52/500</div>
    </div>
  </div>
</body>
</html>
