<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 24px 28px; }
  .label { font-size: 13px; font-weight: 600; color: var(--fg1); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--fg3); margin-bottom: 14px; }
  .ramp { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--gray-200); }
  .sw { flex: 1; height: 70px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 7px; }
  .sw span { font-size: 10px; font-family: var(--font-mono); }
  .hex { font-size: 9px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Neutrals — Slate Gray</div>
    <div class="sub">gray-50 = page bg · gray-100 = borders · gray-600 = body · gray-900 = fg</div>
    <div class="ramp" id="ramp"></div>
  </div>
  <script>
    const tints = [['50','#F9FAFB'],['100','#F3F4F6'],['200','#E5E7EB'],['300','#D1D5DB'],['400','#9CA3AF'],['500','#6B7280'],['600','#4B5563'],['700','#374151'],['800','#1F2937'],['900','#111827']];
    document.getElementById('ramp').innerHTML = tints.map(([k,v]) => {
      const light = ['50','100','200','300','400'].includes(k);
      const c = light ? '#374151' : '#fff';
      return `<div class="sw" style="background:${v};color:${c}"><span>${k}</span><span class="hex">${v}</span></div>`;
    }).join('');
  </script>
</body>
</html>
