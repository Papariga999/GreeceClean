<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-mono); background: #fff; color: var(--fg1); }
  .wrap { padding: 28px 30px; display: flex; flex-direction: column; gap: 18px; }
  .spec { display: flex; align-items: baseline; gap: 18px; }
  .meta { width: 120px; font-size: 10px; font-family: var(--font-mono); color: var(--fg3); flex-shrink: 0; letter-spacing: 0.14em; text-transform: uppercase; }
  .ex { font-family: var(--font-display); color: var(--primary); letter-spacing: 0.02em; }
  .a { color: var(--sky); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spec"><span class="meta">Cormorant 72 · 300</span><span class="ex" style="font-size:52px;font-weight:300;line-height:1;color:var(--ink)">K<span class="a">a</span>tharos</span></div>
    <div class="spec"><span class="meta">Cormorant 40 · 500</span><span class="ex" style="font-size:40px;font-weight:500">Greece deserves to shine</span></div>
    <div class="spec"><span class="meta">Cormorant 28 · 500</span><span class="ex" style="font-size:28px;font-weight:500">How Katharos works</span></div>
    <div class="spec"><span class="meta">Cormorant 21 · 500</span><span class="ex" style="font-size:21px;font-weight:500">Cleanliness Champions</span></div>
  </div>
</body>
</html>
