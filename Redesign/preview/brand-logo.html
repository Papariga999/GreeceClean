<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: 'DM Mono', ui-monospace, Menlo, monospace; background: #fff; }
  .wrap { padding: 22px 26px; display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
  .blue { background: linear-gradient(160deg,#006994,#005A80); border-radius: 16px; padding: 16px 20px; }
  .cap { font-size: 11px; color: #9CA3AF; margin-top: 8px; }
  .col { display: flex; flex-direction: column; align-items: center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../accountability/brand.jsx"></script>
<script type="text/babel">
function App(){
  return (
    <div className="wrap">
      <div className="col"><window.LockupImage height={50} /><div className="cap">Primary lockup</div></div>
      <div className="col blue"><window.Lockup on="blue" mark={28} /></div>
      <div className="col"><window.AppIcon size={72} /><div className="cap">App icon</div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
