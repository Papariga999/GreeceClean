<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 24px 28px; }
  .label { font-size: 13px; font-weight: 600; color: var(--fg1); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--fg3); margin-bottom: 16px; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 9999px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Status Colors — report lifecycle</div>
    <div class="sub">Soft tinted pills. Used on tracking pages, map popups, and the admin table.</div>
    <div class="pills">
      <span class="pill" style="background:#FEF9C3;color:#854D0E">● Pending</span>
      <span class="pill" style="background:#DBEAFE;color:#1E40AF">● In Review</span>
      <span class="pill" style="background:#F3E8FF;color:#6B21A8">● Forwarded</span>
      <span class="pill" style="background:#DCFCE7;color:#166534">● Resolved</span>
      <span class="pill" style="background:#FEE2E2;color:#991B1B">● Rejected</span>
    </div>
  </div>
</body>
</html>
