<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { padding: 24px 28px; }
  .label { font-size: 13px; font-weight: 600; color: var(--fg1); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--fg3); margin-bottom: 14px; }
  .ramp { display: flex; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 76px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
  .sw span { font-size: 10px; font-family: var(--font-mono); }
  .hex { font-size: 10px; opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Action — Eco Green</div>
    <div class="sub">CTAs, confirmation states, resolved badges, completed steps. DEFAULT = 500 = #39B24A</div>
    <div class="ramp" id="ramp"></div>
  </div>
  <script>
    const tints = [['50','#ECF7EE'],['100','#D7EFDB'],['200','#AEDFB6'],['300','#BFE0C6'],['400','#5DBF6D'],['500','#39B24A'],['600','#2E8C3B'],['700','#2E7D34'],['800','#17471D'],['900','#0B230F']];
    document.getElementById('ramp').innerHTML = tints.map(([k,v]) => {
      const light = ['50','100','200','300','400'].includes(k);
      const c = light ? '#27300f' : '#fff';
      return `<div class="sw" style="background:${v};color:${c}"><span>${k}</span><span class="hex">${v}</span></div>`;
    }).join('');
  </script>
</body>
</html>
