<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--gray-50); }
  .wrap { padding: 28px 30px; }
  .label { font-size: 13px; font-weight: 600; color: var(--fg1); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--fg3); margin-bottom: 22px; }
  .row { display: flex; gap: 26px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 110px; height: 56px; background: #fff; border-radius: 16px; }
  .nm { font-size: 11px; font-family: var(--font-mono); color: var(--fg2); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Elevation — minimal, soft</div>
    <div class="sub">Cards barely lift; the hero CTA gets the most. No inner shadows, no colored glows.</div>
    <div class="row">
      <div class="item"><div class="box" style="box-shadow:var(--shadow-sm);border:1px solid var(--gray-100)"></div><span class="nm">sm · cards</span></div>
      <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="nm">md · header</span></div>
      <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="nm">lg · hero CTA</span></div>
      <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="nm">xl</span></div>
    </div>
  </div>
</body>
</html>
