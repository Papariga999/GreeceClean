<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--fg1); }
  .wrap { padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; }
  .spec { display: flex; align-items: baseline; gap: 16px; }
  .meta { width: 92px; font-size: 11px; font-family: var(--font-mono); color: var(--fg3); flex-shrink: 0; }
  .ex { color: var(--primary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spec"><span class="meta">60 · 800</span><span class="ex" style="font-size:46px;font-weight:800;letter-spacing:-0.02em;line-height:1">Keep Greece Clean</span></div>
    <div class="spec"><span class="meta">30 · 700</span><span class="ex" style="font-size:30px;font-weight:700">How it works</span></div>
    <div class="spec"><span class="meta">24 · 700</span><span class="ex" style="font-size:24px;font-weight:700">New Report</span></div>
    <div class="spec"><span class="meta">20 · 600</span><span class="ex" style="font-size:20px;font-weight:600">Cleanliness Champions</span></div>
  </div>
</body>
</html>
