<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: 'Inter', sans-serif; background: #fff; }
  .wrap { padding: 24px 26px; }
  .label { font-size: 13px; font-weight: 700; color: #0D6FDB; margin-bottom: 18px; }
  .row { display: flex; gap: 40px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .nm { font-size: 11px; color: #6B7280; font-weight: 600; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../accountability/brand.jsx"></script>
<script type="text/babel">
function App(){
  return (
    <div className="wrap">
      <div className="label">Map markers — the logo as a pin</div>
      <div className="row">
        <div className="col"><window.MapMarker size={40} /><span className="nm">Standard</span></div>
        <div className="col"><window.MapMarker size={50} active /><span className="nm">Επιλεγμένη / Active</span></div>
        <div className="col"><window.MapMarker size={42} cluster={6} /><span className="nm">Σύμπλεγμα / Cluster</span></div>
      </div>
      <div className="label" style={{ marginTop: 30 }}>Severity pins — tinted by days open</div>
      <div className="row">
        <div className="col"><window.MapMarker size={40} days={4} /><span className="nm">Φρέσκο · &lt;7</span></div>
        <div className="col"><window.MapMarker size={40} days={21} /><span className="nm">Πρόσφατο · &lt;30</span></div>
        <div className="col"><window.MapMarker size={40} days={45} /><span className="nm">Παλαιό · &lt;60</span></div>
        <div className="col"><window.MapMarker size={40} days={80} /><span className="nm">Αγνοείται · 60+</span></div>
        <div className="col"><window.MapMarker size={42} days={80} cluster={9} /><span className="nm">Cluster (hotspot)</span></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
